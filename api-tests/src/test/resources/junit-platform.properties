# Threading for api-tests. A test resource, not a Gradle setting, so an IDE run
# honours the same model as a Gradle run.
#
# Methods concurrent as well as classes: an API test is an HTTP round trip with
# no per-thread native resource behind it, so the limit is the SUT's throughput
# rather than this JVM's memory. This is the layer that should be fast.
#
# It requires what the data design already requires anyway - test data created
# per test, uniquely named, and never depended on by another test.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Dynamic, because the right number here scales with the machine. Override on a
# constrained runner with:
#   -Djunit.jupiter.execution.parallel.config.dynamic.factor=1
junit.jupiter.execution.parallel.config.strategy=dynamic
junit.jupiter.execution.parallel.config.dynamic.factor=3

# ToolshopApiExtension is registered by ServiceLoader rather than by an
# @ExtendWith on every class. Auto-detection is what makes that work, and it is
# per module by design: core's unit tests have nothing to inject.
junit.jupiter.extensions.autodetection.enabled=true
