# Threading for ui-tests. A test resource, not a Gradle setting, so an IDE run
# honours the same model as a Gradle run.
#
# CLASS-LEVEL ONLY. Methods stay on one thread, and that is not a tuning choice.
# @UsePlaywright caches Playwright and Browser per THREAD, and its afterAll
# closes only the calling thread's browser. Concurrent methods inside one class
# therefore leak one browser process per thread, for the lifetime of the JVM.
# See docs/THREADING.md.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Fixed rather than dynamic: this number is one browser process each, so it is
# bounded by memory and not by cores. A hosted CI runner needs a smaller one,
# supplied on the invocation and never branched on in code:
#   -Djunit.jupiter.execution.parallel.config.fixed.parallelism=2
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
