# Profile: ci. The same containers, on a GitHub Actions runner.
#
# Identical to the local profile today, and kept as its own file rather than
# aliased: CI is where the values are most likely to need to differ, and the
# point of the layering is that when they do it is a config change and not a
# branch in code. Anything CI needs to override for one run goes on the
# invocation as -D, forwarded by the build, never read from a file by it.
toolshop.ui.base-url=http://localhost:4200
toolshop.api.base-url=http://localhost:8091

# Same containers, same machine.
toolshop.db.url=jdbc:mariadb://localhost:3306/toolshop
toolshop.db.username=user
toolshop.mail.base-url=http://localhost:1080
