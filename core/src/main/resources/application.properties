# Defaults. Lowest precedence layer, read for every profile.
#
# What belongs here: values that are the same for every target. What does not:
# anything naming a target, which belongs in application-<profile>.properties so
# that a wrong or missing profile cannot silently fall back to localhost - and
# anything secret, which the loader rejects outright if it appears in this file.
#
# Keys are lowercase and hyphen-separated. The dotted key is also its -D name.

# ISO-8601 durations. The UI budget is the larger one: it covers a Playwright
# expectation against a rendered page, not a single HTTP round trip.
toolshop.ui.timeout=PT30S
toolshop.api.timeout=PT10S

# Headless everywhere by default, including locally. Watching a run is the
# exception, and -Dtoolshop.ui.headless=false is how you ask for it.
toolshop.ui.headless=true

# Seeded accounts. These addresses are fixtures published in the application's
# own repository, not identities, so they are configuration like any other. The
# matching passwords are not here: see docs/CONFIGURATION.md.
toolshop.admin.email=admin@practicesoftwaretesting.com
toolshop.customer.email=customer@practicesoftwaretesting.com
