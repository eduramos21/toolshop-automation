# Profile: local. Docker Compose on the developer's machine.
#
# The API has no route at /. Readiness is GET /status.
toolshop.ui.base-url=http://localhost:4200
toolshop.api.base-url=http://localhost:8091

# The database and the mail catcher are containers on this machine, so a local
# run can verify what the application actually wrote and what it actually sent.
# Both are absent from the hosted profiles, which is why these keys are optional.
# The password is a secret like any other and comes from the environment.
toolshop.db.url=jdbc:mariadb://localhost:3306/toolshop
toolshop.db.username=user
toolshop.mail.base-url=http://localhost:1080
