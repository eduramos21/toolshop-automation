# Profile: buggy. The public instance built from a defect-injected branch.
#
# READ THIS BEFORE TREATING A FAILURE HERE AS A BUG IN THE SUITE.
#
# Measured 2026-09: this deployment is not the sprint 5 application with faults
# introduced. It is an OLDER API surface, and it reports "version":"5.0" anyway:
#
#   product ids    integer (1) here, ULID (01M1XMZK...) on sprint 5
#   stock field    "stock" here, "in_stock" on sprint 5
#   foreign keys   brand_id/category_id/product_image_id exposed here, absent there
#   POST /carts    404 here - the route does not exist
#
# So it is a different contract, not a faulty implementation of the same one, and
# the suite is not expected to pass against it. 31 of 41 API tests fail, which
# says the suite notices - not that the suite is wrong.
#
# The target that IS the same version with defects injected is local:
# SPRINT=sprint5-with-bugs on the same compose files, which serves the same URLs
# as the `local` profile and therefore needs no profile of its own.
#
# This profile is kept because it is worth being able to point the suite at a
# genuinely different build with one flag, and because it is the clearest
# argument for the contract validation in a later step: one contract assertion
# would report "this is not the API you compiled against" instead of 31
# unrelated-looking failures.
toolshop.ui.base-url=https://with-bugs.practicesoftwaretesting.com
toolshop.api.base-url=https://api-with-bugs.practicesoftwaretesting.com
