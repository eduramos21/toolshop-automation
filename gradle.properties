# Configuration cache is enabled deliberately, and not for the speed.
# With it on, `problems=fail` is the default, so any untracked System.getenv()
# or System.setProperty() in build logic becomes a hard build error. That is
# what structurally prevents a build script from ever overriding a -D flag.
# See docs/adr/0002-gradle-never-owns-configuration.md
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail

org.gradle.caching=true
org.gradle.parallel=true
